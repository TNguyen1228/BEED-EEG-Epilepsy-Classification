name: CI Pipeline - MLOps Testing & Model Validation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint code with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src api tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 src api tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Pytest Test Suite
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -v

    - name: Execute Model Training & Generate Artifacts
      run: |
        python -m src.models.train

    - name: Validate Model Artifacts
      run: |
        test -f models/random_forest_pipeline.joblib
        test -f models/metrics.json

