project_name: "beed-eeg-epilepsy-classification"

data:
  raw_path: "BEED_Data.csv"
  processed_dir: "data/processed"
  test_size: 0.2
  random_state: 42
  stratify: true
  target_column: "y"
  feature_columns:
    - "X1"
    - "X2"
    - "X3"
    - "X4"
    - "X5"
    - "X6"
    - "X7"
    - "X8"
    - "X9"
    - "X10"
    - "X11"
    - "X12"
    - "X13"
    - "X14"
    - "X15"
    - "X16"

labels:
  0: "Healthy"
  1: "Generalized Seizure"
  2: "Focal Seizure"
  3: "Seizure Event (Mimic)"

model:
  type: "RandomForestClassifier"
  params:
    n_estimators: 200
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 2
    oob_score: true
    n_jobs: -1
    random_state: 42
  saved_model_path: "models/random_forest_pipeline.joblib"
  metrics_output_path: "models/metrics.json"

mlflow:
  experiment_name: "BEED_Epilepsy_RF_Experiment"
  tracking_uri: "file:./mlruns"

api:
  host: "0.0.0.0"
  port: 8000
  model_path: "models/random_forest_pipeline.joblib"

